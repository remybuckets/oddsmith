openapi: 3.1.0
info:
  title: Oddsmith API
  version: 0.1.0
  description: |
    Contract between web/ and api/. Owned by the lead lane; change it on main, then lanes rebase.

    Auth: the web app signs users in with Supabase Auth (email magic link) using supabase-js,
    then sends `Authorization: Bearer <supabase access token>` on every request. The backend
    verifies the JWT; the Supabase user id is the user id everywhere. There are no /auth routes.

    Every JSON response uses the Envelope. Streaming answers use Server-Sent Events (see
    SendMessage). Times are ISO 8601 UTC; the UI renders them in Europe/London.
servers:
  - url: http://localhost:8000
    description: Local dev
security:
  - supabaseJwt: []

paths:
  /onboarding/age:
    post:
      summary: Record the 18+ declaration. Chat is blocked until this is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_over_18, accepts_terms]
              properties:
                is_over_18: { const: true }
                accepts_terms: { const: true }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "422": { $ref: "#/components/responses/Error" }

  /me:
    get:
      summary: Profile, today's usage and limit.
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete the account and all of its data (Supabase user + chats, usage, feedback).
      responses:
        "200": { $ref: "#/components/responses/Empty" }

  /me/break:
    post:
      summary: Take a break. Blocks chat until the returned time; cannot be shortened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: { enum: ["24h", "7d", "30d"] }
      responses:
        "200": { $ref: "#/components/responses/Me" }

  /conversations:
    get:
      summary: List the user's chats, newest first.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Conversation" }
    post:
      summary: Start a chat.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Conversation" }

  /conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Messages in a chat, oldest first, with any cards and sources for assistant messages.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: SendMessage
      summary: Ask a question; the answer streams back as Server-Sent Events.
      description: |
        Checks run before streaming starts and fail with a normal JSON error:
        401 unauthenticated, 403 age_not_confirmed / on_break, 429 daily_limit_reached /
        rate_limited, 503 budget_exhausted ("back tomorrow").

        Stream order: message_start, then any mix of tool_status / text_delta / card,
        then sources, then message_end. An `error` event can replace everything after
        message_start. Each SSE frame is `event: <type>` + `data: <json>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: SSE stream of StreamEvent objects
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /fixtures/next:
    get:
      summary: Next matchweek's fixtures for the home strip, with suggested questions.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        required: [matchweek, fixtures, suggested_questions]
                        properties:
                          matchweek: { type: integer }
                          fixtures:
                            type: array
                            items: { $ref: "#/components/schemas/Fixture" }
                          suggested_questions:
                            type: array
                            items: { type: string }
                            maxItems: 6

  /feedback:
    post:
      summary: Thumbs up or down on an assistant message. Re-posting replaces the previous rating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, rating]
              properties:
                message_id: { type: string, format: uuid }
                rating: { enum: [1, -1] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Empty" }

  /health:
    get:
      summary: Uptime and the last successful run per ingestion job.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        required: [status, jobs]
                        properties:
                          status: { enum: [ok, degraded] }
                          jobs:
                            type: array
                            items:
                              type: object
                              required: [name, last_success_at, is_stale]
                              properties:
                                name: { type: string }
                                last_success_at: { type: [string, "null"], format: date-time }
                                is_stale: { type: boolean }

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Me:
      description: Current user
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  data: { $ref: "#/components/schemas/Me" }
    Empty:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }

  schemas:
    Envelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data: {}
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ApiError"
        meta:
          type: object
          properties:
            next_cursor: { type: [string, "null"] }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          enum:
            - unauthenticated
            - age_not_confirmed
            - on_break
            - daily_limit_reached
            - rate_limited
            - budget_exhausted
            - not_found
            - invalid_input
            - internal
        message: { type: string, description: User-friendly; shown in the UI as-is }
        retry_at: { type: [string, "null"], format: date-time }

    Me:
      type: object
      required: [id, email, age_confirmed, self_excluded_until, usage]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        age_confirmed: { type: boolean }
        self_excluded_until: { type: [string, "null"], format: date-time }
        usage:
          type: object
          required: [questions_today, daily_limit, resets_at]
          properties:
            questions_today: { type: integer }
            daily_limit: { type: integer }
            resets_at: { type: string, format: date-time, description: Next UK midnight }

    Conversation:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Message:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { enum: [user, assistant] }
        content: { type: string, description: Markdown }
        cards:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        feedback: { enum: [1, -1, null] }
        created_at: { type: string, format: date-time }

    Fixture:
      type: object
      required: [fixture_id, matchweek, kickoff_at, status, home, away]
      properties:
        fixture_id: { type: integer }
        matchweek: { type: [integer, "null"] }
        kickoff_at: { type: string, format: date-time }
        status: { enum: [scheduled, live, finished, postponed, cancelled] }
        home: { $ref: "#/components/schemas/TeamRef" }
        away: { $ref: "#/components/schemas/TeamRef" }
        home_score: { type: [integer, "null"] }
        away_score: { type: [integer, "null"] }

    TeamRef:
      type: object
      required: [id, name, short_name]
      properties:
        id: { type: integer }
        name: { type: string }
        short_name: { type: string }

    SourceRef:
      type: object
      required: [source, as_of, is_stale]
      properties:
        source: { type: string, examples: ["API-Football"] }
        as_of: { type: string, format: date-time }
        is_stale: { type: boolean }

    # ---- Answer cards (built by the orchestrator from tool results) ----

    Card:
      oneOf:
        - $ref: "#/components/schemas/StatCard"
        - $ref: "#/components/schemas/OddsCard"
        - $ref: "#/components/schemas/ValueCard"
      discriminator:
        propertyName: card_type

    StatCard:
      type: object
      required: [card_type, title, columns, rows, source]
      properties:
        card_type: { const: stat }
        title: { type: string, examples: ["Saka — away, 2026/27"] }
        columns: { type: array, items: { type: string } }
        rows:
          type: array
          items:
            type: array
            items: { type: [string, number, "null"] }
        form: { type: [string, "null"], pattern: "^[WDL]{0,10}$", description: Rendered as a form strip }
        source: { $ref: "#/components/schemas/SourceRef" }

    OddsCard:
      type: object
      required: [card_type, fixture, market, selections, source]
      properties:
        card_type: { const: odds }
        fixture: { $ref: "#/components/schemas/Fixture" }
        market: { enum: [h2h, totals, btts] }
        line: { type: [number, "null"] }
        selections:
          type: array
          items:
            type: object
            required: [selection, label, best_price, best_bookmaker, prices]
            properties:
              selection: { enum: [home, draw, away, over, under, "yes", "no"] }
              label: { type: string, examples: ["Newcastle", "Over 2.5"] }
              best_price: { type: number }
              best_bookmaker: { type: string }
              prices:
                type: array
                maxItems: 4
                items:
                  type: object
                  required: [bookmaker, price]
                  properties:
                    bookmaker: { type: string }
                    price: { type: number }
        source: { $ref: "#/components/schemas/SourceRef" }

    ValueCard:
      type: object
      required: [card_type, fixture, market, selection, label, model_probability, implied_probability, edge, best_price, best_bookmaker, is_highlighted, disclaimer, source]
      properties:
        card_type: { const: value }
        fixture: { $ref: "#/components/schemas/Fixture" }
        market: { enum: [h2h, totals, btts] }
        line: { type: [number, "null"] }
        selection: { enum: [home, draw, away, over, under, "yes", "no"] }
        label: { type: string }
        model_probability: { type: number }
        implied_probability: { type: number }
        edge: { type: number }
        best_price: { type: number }
        best_bookmaker: { type: string }
        is_highlighted: { type: boolean, description: True only when edge is above the configured threshold }
        disclaimer: { const: "Estimate, not advice." }
        source: { $ref: "#/components/schemas/SourceRef" }

    # ---- SSE events for SendMessage ----

    StreamEvent:
      oneOf:
        - $ref: "#/components/schemas/MessageStartEvent"
        - $ref: "#/components/schemas/ToolStatusEvent"
        - $ref: "#/components/schemas/TextDeltaEvent"
        - $ref: "#/components/schemas/CardEvent"
        - $ref: "#/components/schemas/SourcesEvent"
        - $ref: "#/components/schemas/MessageEndEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: type

    MessageStartEvent:
      type: object
      required: [type, message_id, conversation_id]
      properties:
        type: { const: message_start }
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }

    ToolStatusEvent:
      type: object
      required: [type, tool, status, label]
      description: Drives the "Checking odds…" indicator. Never contains raw tool output.
      properties:
        type: { const: tool_status }
        tool: { type: string }
        status: { enum: [started, finished, failed] }
        label: { type: string, examples: ["Checking injuries"] }

    TextDeltaEvent:
      type: object
      required: [type, text]
      properties:
        type: { const: text_delta }
        text: { type: string }

    CardEvent:
      type: object
      required: [type, card]
      properties:
        type: { const: card }
        card: { $ref: "#/components/schemas/Card" }

    SourcesEvent:
      type: object
      required: [type, sources]
      properties:
        type: { const: sources }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }

    MessageEndEvent:
      type: object
      required: [type, message_id, questions_remaining]
      properties:
        type: { const: message_end }
        message_id: { type: string, format: uuid }
        questions_remaining: { type: integer }

    ErrorEvent:
      type: object
      required: [type, error]
      properties:
        type: { const: error }
        error: { $ref: "#/components/schemas/ApiError" }
